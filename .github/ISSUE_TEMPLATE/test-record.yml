name: テスト記録
description: 単体・結合・システム・受入テストの実施結果
title: "[TEST][UNIT] "
labels: ["type:test"]
body:
  - type: markdown
    attributes:
      value: |
        **この Issue がテストの記録になる。** 試験項目は、基板仕様書 (単体)、ユニット仕様書 (結合)、電装系仕様書 (システム・受入) のテスト項目を使う。
        - **実測値を残す。** 「OK」だけの記録は、次年度にも不具合解析にも使えない
        - 高電圧を扱う試験は、**ESO の許可を得てから**行い、「実施前確認」に記録する
        - 不合格の項目は不具合の Issue を起票し、ここに番号を書く。次の工程に進めるかは、[テストの不合格と未実施の扱い](https://github.com/TUT-ProjectEV/.github-private/blob/main/phases.md#9-テストの不合格と未実施の扱い) に従って判断者が決める
        - 波形・写真はこの Issue に貼り付ける。大きなログは共有ストレージに置き、パスを書く
        - 未実施の項目は、実施したふりをせず理由を書く。未実施も不合格と同じ区分で、次の工程に進めるかを判断する
        - 記録したら、仕様書の要求一覧の「結果」にこの Issue へのリンクを書く
  - type: input
    id: vehicle
    attributes:
      label: 対象車両
      description: 車両コード。ID は車両ごとに採番するため、車両コードとセットで記録する
      placeholder: "例: EV26"
    validations:
      required: true
  - type: input
    id: tr-id
    attributes:
      label: テスト記録 ID
      description: 同じ日・同じ対象の2件目以降は、末尾の連番を上げる
      placeholder: "例: TR-UT-SDC-20260428-01"
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: 試験レベル
      options:
        - 単体テスト
        - 結合テスト
        - システムテスト
        - 受入テスト
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: テスト項目の出典
      description: 文書と章、使った版のタグまたはコミット
      placeholder: "例: docs/SDC-PCB-MAIN-SPEC.md の 11 章 (コミット a1b2c3d)"
    validations:
      required: true
  - type: textarea
    id: people
    attributes:
      label: 実施日・実施者・立会者
      value: |
        - 実施日:
        - 実施者:
        - 立会者:
    validations:
      required: true
  - type: textarea
    id: precheck
    attributes:
      label: 実施前確認
      description: 高電圧を扱わない試験では、高電圧の項目を削除してよい
      value: |
        - [ ] 試験手順を、実施者・立会者で読み合わせた
        - [ ] 使用する測定器のレンジ・定格と、校正の期限を確認した
        - [ ] 緊急停止の手段と担当者を決めた

        高電圧 (TS) を扱う試験:
        - [ ] ESO が実施を許可した (ESO: 、日時: ) (EV.11.1.1)
        - [ ] 初めて高電圧をかける対象の場合、通電前確認 (絶縁抵抗・導通) と、低電圧でのシャットダウン回路の動作確認が済んでいる
        - [ ] 作業は2名以上で行い、1名は作業に触れず監視する
        - [ ] 車両での作業時、TSMS を OFF にしてロックアウトした (EV.11.3.1)
        - [ ] 保護具 (試験日から12か月以内の HV 絶縁手袋、側面シールド付き保護メガネ、必要に応じてフェイスシールド) と絶縁工具を用意した (EV.11.2)
    validations:
      required: true
  - type: textarea
    id: dut
    attributes:
      label: 供試体
      value: |
        - 基板ID / リビジョン (ユニット・車両の場合はその構成):
        - 個体識別:
        - ファームウェアのタグとコミット:
        - パラメータ・設定 (設定ファイルのパスとコミット、または既定値から変えた値):
        - 校正値 (センサのオフセットなど):
        - ハーネス:
        - 改造・暫定対応 (ジャンパ、定数変更など):
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 試験環境
      value: |
        - 使用測定器と設定 (校正の期限):
        - 治具・模擬環境:
        - 電源設定:
        - 環境条件 (室温・天候):
        - 場所:
  - type: textarea
    id: results
    attributes:
      label: 試験結果
      description: 1 項目 1 行。判定は 合格 / 不合格 / 条件付き / 未実施
      value: |
        | テストID | 判定 | 判定基準 | 実測値・結果 | 備考 |
        | --- | --- | --- | --- | --- |
        |  |  |  |  |  |
    validations:
      required: true
  - type: textarea
    id: skipped
    attributes:
      label: 未実施の項目と理由
      description: 実施に必要な条件と実施予定も書く
  - type: textarea
    id: defects
    attributes:
      label: 不具合
      description: 起票した不具合の Issue 番号
  - type: textarea
    id: notes
    attributes:
      label: 所見
      description: 判定基準は満たしたが気になった点、次リビジョン・次年度への申し送り。数値の傾向や余裕度
  - type: dropdown
    id: overall
    attributes:
      label: 総合判定
      options:
        - 合格
        - 条件付き合格
        - 不合格
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: 次の工程への判断
      description: 不合格・未実施がある場合は、区分と判断者を必ず書く。判断者は主査、safety:hv が付くものは ESO
      value: |
        - 次の工程に: 進める / 条件付きで進める / 進めない
        - 不合格・未実施の区分 (次工程を止める / 条件付きで進める / 次年度に引き継ぐ):
        - 条件と期限 (条件付きの場合):
        - 再試験が必要な項目:
        - 判断者:
  - type: textarea
    id: attachments
    attributes:
      label: ログ・波形・写真
      description: 画像はドラッグして貼り付ける。大きなファイルは共有ストレージのパスを書く
